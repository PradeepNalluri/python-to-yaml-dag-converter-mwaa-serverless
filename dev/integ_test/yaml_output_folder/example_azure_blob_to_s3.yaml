example_azure_blob_to_s3:
  dag_id: example_azure_blob_to_s3
  params: {}
  default_args:
    start_date:
      __type__: datetime.datetime
      year: 2026
      month: 1
      day: 1
  schedule: '@once'
  tasks:
    create_s3_bucket:
      operator: airflow.providers.amazon.aws.operators.s3.S3CreateBucketOperator
      aws_conn_id: aws_default
      bucket_name: test-azure_blob-to-s3-bucket
      outlets: []
      priority_weight: 1
      retries: 0
      retry_delay:
        __type__: datetime.timedelta
        seconds: 300.0
      retry_exponential_backoff: false
      start_date:
        __type__: datetime.datetime
        year: 2026
        month: 1
        day: 1
      task_id: create_s3_bucket
      trigger_rule: all_success
      wait_for_downstream: false
      dependencies: []
    azure_blob_to_s3:
      operator: airflow.providers.amazon.aws.transfers.azure_blob_to_s3.AzureBlobStorageToS3Operator
      aws_conn_id: aws_default
      container_name: test-azure_blob-to-s3-container
      delimiter: ''
      dest_s3_extra_args: {}
      dest_s3_key: s3://test-azure_blob-to-s3-bucket/test-azure_blob-to-s3-key
      outlets: []
      priority_weight: 1
      replace: false
      retries: 0
      retry_delay:
        __type__: datetime.timedelta
        seconds: 300.0
      retry_exponential_backoff: false
      s3_extra_args: {}
      start_date:
        __type__: datetime.datetime
        year: 2026
        month: 1
        day: 1
      task_id: azure_blob_to_s3
      trigger_rule: all_success
      wait_for_downstream: false
      wasb_conn_id: wasb_default
      wasb_extra_args: {}
      dependencies:
      - create_s3_bucket
    delete_s3_bucket:
      operator: airflow.providers.amazon.aws.operators.s3.S3DeleteBucketOperator
      aws_conn_id: aws_default
      bucket_name: test-azure_blob-to-s3-bucket
      force_delete: true
      outlets: []
      priority_weight: 1
      retries: 0
      retry_delay:
        __type__: datetime.timedelta
        seconds: 300.0
      retry_exponential_backoff: false
      start_date:
        __type__: datetime.datetime
        year: 2026
        month: 1
        day: 1
      task_id: delete_s3_bucket
      trigger_rule: all_done
      wait_for_downstream: false
      dependencies:
      - azure_blob_to_s3
  catchup: false
  dag_display_name: example_azure_blob_to_s3
  owner_links: {}
  start_date:
    __type__: datetime.datetime
    year: 2026
    month: 1
    day: 1
  tags: []
