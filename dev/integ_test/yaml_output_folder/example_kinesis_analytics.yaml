example_kinesis_analytics:
  dag_id: example_kinesis_analytics
  params: {}
  default_args:
    start_date:
      __type__: datetime.datetime
      year: 2026
      month: 1
      day: 1
  schedule: '@once'
  tasks:
    create_bucket:
      operator: airflow.providers.amazon.aws.operators.s3.S3CreateBucketOperator
      aws_conn_id: aws_default
      bucket_name: test-kinesis-analytics
      outlets: []
      priority_weight: 1
      retries: 0
      retry_delay:
        __type__: datetime.timedelta
        seconds: 300.0
      retry_exponential_backoff: false
      start_date:
        __type__: datetime.datetime
        year: 2026
        month: 1
        day: 1
      task_id: create_bucket
      trigger_rule: all_success
      wait_for_downstream: false
      dependencies: []
    delete_bucket:
      operator: airflow.providers.amazon.aws.operators.s3.S3DeleteBucketOperator
      aws_conn_id: aws_default
      bucket_name: test-kinesis-analytics
      force_delete: true
      outlets: []
      priority_weight: 1
      retries: 0
      retry_delay:
        __type__: datetime.timedelta
        seconds: 300.0
      retry_exponential_backoff: false
      start_date:
        __type__: datetime.datetime
        year: 2026
        month: 1
        day: 1
      task_id: delete_bucket
      trigger_rule: all_done
      wait_for_downstream: false
      dependencies:
      - delete_kinesis_stream
    copy_jar_file:
      operator: airflow.providers.amazon.aws.transfers.http_to_s3.HttpToS3Operator
      aws_conn_id: aws_default
      data: {}
      encrypt: false
      endpoint: awslabs/managed-service-for-apache-flink-blueprints/releases/download/v2.0.1/kds-to-s3-datastream-java-1.0.1.jar
      extra_options: {}
      headers: {}
      http_conn_id: test-git
      log_response: false
      method: GET
      outlets: []
      priority_weight: 1
      replace: false
      retries: 0
      retry_delay:
        __type__: datetime.timedelta
        seconds: 300.0
      retry_exponential_backoff: false
      s3_bucket: test-kinesis-analytics
      s3_key: code/kds-to-s3-datastream-java-1.0.1.jar
      start_date:
        __type__: datetime.datetime
        year: 2026
        month: 1
        day: 1
      task_id: copy_jar_file
      tcp_keep_alive: true
      tcp_keep_alive_count: 20
      tcp_keep_alive_idle: 120
      tcp_keep_alive_interval: 30
      trigger_rule: all_success
      wait_for_downstream: false
      dependencies:
      - create_connection
    create_application:
      operator: airflow.providers.amazon.aws.operators.kinesis_analytics.KinesisAnalyticsV2CreateApplicationOperator
      application_description: Managed Service for Apache Flink application created
        from Airflow
      application_name: test-test-app
      aws_conn_id: aws_default
      create_application_kwargs:
        ApplicationConfiguration:
          FlinkApplicationConfiguration:
            ParallelismConfiguration:
              ConfigurationType: CUSTOM
              Parallelism: 2
              ParallelismPerKPU: 1
              AutoScalingEnabled: false
          EnvironmentProperties:
            PropertyGroups:
            - PropertyGroupId: BlueprintMetadata
              PropertyMap:
                AWSRegion: us-east-1
                BlueprintName: KDS_FLINK-DATASTREAM-JAVA_S3
                BucketName: s3://test-kinesis-analytics/
                PartitionFormat: yyyy-MM-dd-HH
                StreamInitialPosition: TRIM_HORIZON
                StreamName: test-test-stream
          ApplicationCodeConfiguration:
            CodeContent:
              S3ContentLocation:
                BucketARN: arn:aws:s3:::test-kinesis-analytics
                FileKey: code/kds-to-s3-datastream-java-1.0.1.jar
            CodeContentType: ZIPFILE
      outlets: []
      priority_weight: 1
      retries: 0
      retry_delay:
        __type__: datetime.timedelta
        seconds: 300.0
      retry_exponential_backoff: false
      runtime_environment: FLINK-1_18
      service_execution_role: test-role-arn
      start_date:
        __type__: datetime.datetime
        year: 2026
        month: 1
        day: 1
      task_id: create_application
      trigger_rule: all_success
      wait_for_downstream: false
      dependencies:
      - delete_connection
    start_application:
      operator: airflow.providers.amazon.aws.operators.kinesis_analytics.KinesisAnalyticsV2StartApplicationOperator
      application_name: test-test-app
      aws_conn_id: aws_default
      deferrable: false
      outlets: []
      priority_weight: 1
      retries: 0
      retry_delay:
        __type__: datetime.timedelta
        seconds: 300.0
      retry_exponential_backoff: false
      run_configuration: {}
      start_date:
        __type__: datetime.datetime
        year: 2026
        month: 1
        day: 1
      task_id: start_application
      trigger_rule: all_success
      wait_for_completion: false
      wait_for_downstream: false
      waiter_delay: 60
      waiter_max_attempts: 20
      dependencies:
      - create_application
    await_start_application:
      operator: airflow.providers.amazon.aws.sensors.kinesis_analytics.KinesisAnalyticsV2StartApplicationCompletedSensor
      application_name: test-test-app
      aws_conn_id: aws_default
      deferrable: false
      max_retries: 75
      mode: poke
      outlets: []
      poke_interval: 120
      priority_weight: 1
      retries: 0
      retry_delay:
        __type__: datetime.timedelta
        seconds: 300.0
      retry_exponential_backoff: false
      start_date:
        __type__: datetime.datetime
        year: 2026
        month: 1
        day: 1
      task_id: await_start_application
      timeout: 604800.0
      trigger_rule: all_success
      wait_for_downstream: false
      dependencies:
      - start_application
    stop_application:
      operator: airflow.providers.amazon.aws.operators.kinesis_analytics.KinesisAnalyticsV2StopApplicationOperator
      application_name: test-test-app
      aws_conn_id: aws_default
      deferrable: false
      force: true
      outlets: []
      priority_weight: 1
      retries: 0
      retry_delay:
        __type__: datetime.timedelta
        seconds: 300.0
      retry_exponential_backoff: false
      start_date:
        __type__: datetime.datetime
        year: 2026
        month: 1
        day: 1
      task_id: stop_application
      trigger_rule: all_success
      wait_for_completion: false
      wait_for_downstream: false
      waiter_delay: 60
      waiter_max_attempts: 20
      dependencies:
      - await_start_application
    await_stop_application:
      operator: airflow.providers.amazon.aws.sensors.kinesis_analytics.KinesisAnalyticsV2StopApplicationCompletedSensor
      application_name: test-test-app
      aws_conn_id: aws_default
      deferrable: false
      max_retries: 75
      mode: poke
      outlets: []
      poke_interval: 120
      priority_weight: 1
      retries: 0
      retry_delay:
        __type__: datetime.timedelta
        seconds: 300.0
      retry_exponential_backoff: false
      start_date:
        __type__: datetime.datetime
        year: 2026
        month: 1
        day: 1
      task_id: await_stop_application
      timeout: 604800.0
      trigger_rule: all_success
      wait_for_downstream: false
      dependencies:
      - stop_application
    create_kinesis_stream:
      decorator: airflow.providers.standard.decorators.python.python_task
      outlets: []
      priority_weight: 1
      python_callable: example_kinesis_analytics_taskflow.create_kinesis_stream
      retries: 0
      retry_delay:
        __type__: datetime.timedelta
        seconds: 300.0
      retry_exponential_backoff: false
      start_date:
        __type__: datetime.datetime
        year: 2026
        month: 1
        day: 1
      task_id: create_kinesis_stream
      trigger_rule: all_success
      wait_for_downstream: false
      multiple_outputs: false
      dependencies:
      - create_bucket
      stream: test-test-stream
      region: us-east-1
    create_connection:
      decorator: airflow.providers.standard.decorators.python.python_task
      outlets: []
      priority_weight: 1
      python_callable: example_kinesis_analytics_taskflow.create_connection
      retries: 0
      retry_delay:
        __type__: datetime.timedelta
        seconds: 300.0
      retry_exponential_backoff: false
      start_date:
        __type__: datetime.datetime
        year: 2026
        month: 1
        day: 1
      task_id: create_connection
      trigger_rule: all_success
      wait_for_downstream: false
      multiple_outputs: false
      dependencies:
      - create_kinesis_stream
      conn_id: test-git
    delete_connection:
      decorator: airflow.providers.standard.decorators.python.python_task
      outlets: []
      priority_weight: 1
      python_callable: example_kinesis_analytics_taskflow.delete_connection
      retries: 0
      retry_delay:
        __type__: datetime.timedelta
        seconds: 300.0
      retry_exponential_backoff: false
      start_date:
        __type__: datetime.datetime
        year: 2026
        month: 1
        day: 1
      task_id: delete_connection
      trigger_rule: all_done
      wait_for_downstream: false
      multiple_outputs: false
      dependencies:
      - copy_jar_file
      conn_id: test-git
    delete_application:
      decorator: airflow.providers.standard.decorators.python.python_task
      outlets: []
      priority_weight: 1
      python_callable: example_kinesis_analytics_taskflow.delete_application
      retries: 0
      retry_delay:
        __type__: datetime.timedelta
        seconds: 300.0
      retry_exponential_backoff: false
      start_date:
        __type__: datetime.datetime
        year: 2026
        month: 1
        day: 1
      task_id: delete_application
      trigger_rule: all_done
      wait_for_downstream: false
      multiple_outputs: false
      dependencies:
      - await_stop_application
      app_name: test-test-app
    delete_kinesis_stream:
      decorator: airflow.providers.standard.decorators.python.python_task
      outlets: []
      priority_weight: 1
      python_callable: example_kinesis_analytics_taskflow.delete_kinesis_stream
      retries: 0
      retry_delay:
        __type__: datetime.timedelta
        seconds: 300.0
      retry_exponential_backoff: false
      start_date:
        __type__: datetime.datetime
        year: 2026
        month: 1
        day: 1
      task_id: delete_kinesis_stream
      trigger_rule: all_done
      wait_for_downstream: false
      multiple_outputs: false
      dependencies:
      - delete_application
      stream: test-test-stream
      region: us-east-1
  catchup: false
  dag_display_name: example_kinesis_analytics
  owner_links: {}
  start_date:
    __type__: datetime.datetime
    year: 2026
    month: 1
    day: 1
  tags: []
