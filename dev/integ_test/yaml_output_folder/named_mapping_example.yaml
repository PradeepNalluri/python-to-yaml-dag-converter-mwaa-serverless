named_mapping_example:
  dag_id: named_mapping_example
  params: {}
  default_args:
    start_date:
      __type__: datetime.datetime
      year: 2026
      month: 1
      day: 1
  schedule: '@daily'
  tasks:
    generate_data:
      operator: airflow.providers.standard.operators.python.PythonOperator
      op_args: []
      op_kwargs: {}
      outlets: []
      priority_weight: 1
      python_callable: dtm_named_mapping.generate_data
      retries: 0
      retry_delay:
        __type__: datetime.timedelta
        seconds: 300.0
      retry_exponential_backoff: false
      start_date:
        __type__: datetime.datetime
        year: 2026
        month: 1
        day: 1
      task_id: generate_data
      trigger_rule: all_success
      wait_for_downstream: false
      dependencies: []
    process_city:
      operator: airflow.providers.standard.operators.python.PythonOperator
      outlets: []
      priority_weight: 1
      retries: 0
      retry_delay:
        __type__: datetime.timedelta
        seconds: 300.0
      retry_exponential_backoff: false
      start_date:
        __type__: datetime.datetime
        year: 2026
        month: 1
        day: 1
      task_id: process_city
      trigger_rule: all_success
      wait_for_downstream: false
      dependencies:
      - generate_data
      expand:
        op_args: generate_data.output
      partial:
        map_index_template: '{{ city_name }}'
        weight_rule: downstream
      python_callable: dtm_named_mapping.process_city_data
    summarize:
      operator: airflow.providers.standard.operators.python.PythonOperator
      op_args: []
      op_kwargs:
        results: "{{ task_instance.xcom_pull(task_ids='process_city', key='return_value')\
          \ }}"
      outlets: []
      priority_weight: 1
      python_callable: dtm_named_mapping.summarize_results
      retries: 0
      retry_delay:
        __type__: datetime.timedelta
        seconds: 300.0
      retry_exponential_backoff: false
      start_date:
        __type__: datetime.datetime
        year: 2026
        month: 1
        day: 1
      task_id: summarize
      trigger_rule: all_success
      wait_for_downstream: false
      dependencies:
      - process_city
  catchup: false
  dag_display_name: named_mapping_example
  owner_links: {}
  start_date:
    __type__: datetime.datetime
    year: 2026
    month: 1
    day: 1
  tags: []
