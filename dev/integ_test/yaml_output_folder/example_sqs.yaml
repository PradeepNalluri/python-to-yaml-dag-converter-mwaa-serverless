example_sqs:
  dag_id: example_sqs
  params: {}
  default_args:
    start_date:
      __type__: datetime.datetime
      year: 2026
      month: 1
      day: 1
  schedule: '@once'
  tasks:
    create_queue:
      decorator: airflow.providers.standard.decorators.python.python_task
      outlets: []
      priority_weight: 1
      python_callable: example_sqs_taskflow.create_queue
      retries: 0
      retry_delay:
        __type__: datetime.timedelta
        seconds: 300.0
      retry_exponential_backoff: false
      start_date:
        __type__: datetime.datetime
        year: 2026
        month: 1
        day: 1
      task_id: create_queue
      trigger_rule: all_success
      wait_for_downstream: false
      multiple_outputs: false
      dependencies: []
      queue_name: test-example-queue
    publish_to_queue_1:
      operator: airflow.providers.amazon.aws.operators.sqs.SqsPublishOperator
      aws_conn_id: aws_default
      delay_seconds: 0
      message_attributes: {}
      message_content: '{{ task_instance }}'
      outlets: []
      priority_weight: 1
      retries: 0
      retry_delay:
        __type__: datetime.timedelta
        seconds: 300.0
      retry_exponential_backoff: false
      sqs_queue: "{{ task_instance.xcom_pull(task_ids='create_queue', key='return_value')\
        \ }}"
      start_date:
        __type__: datetime.datetime
        year: 2026
        month: 1
        day: 1
      task_id: publish_to_queue_1
      trigger_rule: all_success
      wait_for_downstream: false
      dependencies:
      - create_queue
    publish_to_queue_2:
      operator: airflow.providers.amazon.aws.operators.sqs.SqsPublishOperator
      aws_conn_id: aws_default
      delay_seconds: 0
      message_attributes: {}
      message_content: '{{ task_instance }}'
      outlets: []
      priority_weight: 1
      retries: 0
      retry_delay:
        __type__: datetime.timedelta
        seconds: 300.0
      retry_exponential_backoff: false
      sqs_queue: "{{ task_instance.xcom_pull(task_ids='create_queue', key='return_value')\
        \ }}"
      start_date:
        __type__: datetime.datetime
        year: 2026
        month: 1
        day: 1
      task_id: publish_to_queue_2
      trigger_rule: all_success
      wait_for_downstream: false
      dependencies:
      - create_queue
      - read_from_queue
    read_from_queue:
      operator: airflow.providers.amazon.aws.sensors.sqs.SqsSensor
      aws_conn_id: aws_default
      deferrable: false
      delete_message_on_reception: true
      max_messages: 5
      mode: poke
      num_batches: 1
      outlets: []
      poke_interval: 60.0
      priority_weight: 1
      retries: 0
      retry_delay:
        __type__: datetime.timedelta
        seconds: 300.0
      retry_exponential_backoff: false
      sqs_queue: "{{ task_instance.xcom_pull(task_ids='create_queue', key='return_value')\
        \ }}"
      start_date:
        __type__: datetime.datetime
        year: 2026
        month: 1
        day: 1
      task_id: read_from_queue
      timeout: 604800.0
      trigger_rule: all_success
      wait_for_downstream: false
      wait_time_seconds: 1
      dependencies:
      - publish_to_queue_1
      - create_queue
    read_from_queue_in_batch:
      operator: airflow.providers.amazon.aws.sensors.sqs.SqsSensor
      aws_conn_id: aws_default
      deferrable: false
      delete_message_on_reception: true
      max_messages: 10
      mode: poke
      num_batches: 3
      outlets: []
      poke_interval: 60.0
      priority_weight: 1
      retries: 0
      retry_delay:
        __type__: datetime.timedelta
        seconds: 300.0
      retry_exponential_backoff: false
      sqs_queue: "{{ task_instance.xcom_pull(task_ids='create_queue', key='return_value')\
        \ }}"
      start_date:
        __type__: datetime.datetime
        year: 2026
        month: 1
        day: 1
      task_id: read_from_queue_in_batch
      timeout: 604800.0
      trigger_rule: all_success
      wait_for_downstream: false
      wait_time_seconds: 1
      dependencies:
      - create_queue
      - publish_to_queue_2
    delete_queue:
      decorator: airflow.providers.standard.decorators.python.python_task
      outlets: []
      priority_weight: 1
      python_callable: example_sqs_taskflow.delete_queue
      retries: 0
      retry_delay:
        __type__: datetime.timedelta
        seconds: 300.0
      retry_exponential_backoff: false
      start_date:
        __type__: datetime.datetime
        year: 2026
        month: 1
        day: 1
      task_id: delete_queue
      trigger_rule: all_done
      wait_for_downstream: false
      multiple_outputs: false
      dependencies:
      - create_queue
      - read_from_queue_in_batch
      queue_url: +create_queue
  catchup: false
  dag_display_name: example_sqs
  owner_links: {}
  start_date:
    __type__: datetime.datetime
    year: 2026
    month: 1
    day: 1
  tags: []
