example_eks_with_nodegroups:
  dag_id: example_eks_with_nodegroups
  params: {}
  default_args:
    start_date:
      __type__: datetime.datetime
      year: 2026
      month: 1
      day: 1
  schedule: '@once'
  tasks:
    create_cluster:
      operator: airflow.providers.amazon.aws.operators.eks.EksCreateClusterOperator
      aws_conn_id: aws_default
      cluster_name: test-cluster
      cluster_role_arn: test-role-arn
      create_cluster_kwargs: {}
      create_fargate_profile_kwargs: {}
      create_nodegroup_kwargs: {}
      deferrable: false
      fargate_profile_name: profile
      fargate_selectors:
      - namespace: default
      nodegroup_name: nodegroup
      outlets: []
      priority_weight: 1
      resources_vpc_config:
        subnetIds:
        - subnet-12345ab
        - subnet-67890cd
      retries: 0
      retry_delay:
        __type__: datetime.timedelta
        seconds: 300.0
      retry_exponential_backoff: false
      start_date:
        __type__: datetime.datetime
        year: 2026
        month: 1
        day: 1
      task_id: create_cluster
      trigger_rule: all_success
      wait_for_completion: false
      wait_for_downstream: false
      waiter_delay: 30
      waiter_max_attempts: 40
      dependencies:
      - create_launch_template
    await_create_cluster:
      operator: airflow.providers.amazon.aws.sensors.eks.EksClusterStateSensor
      aws_conn_id: aws_default
      cluster_name: test-cluster
      mode: poke
      outlets: []
      poke_interval: 60.0
      priority_weight: 1
      retries: 0
      retry_delay:
        __type__: datetime.timedelta
        seconds: 300.0
      retry_exponential_backoff: false
      start_date:
        __type__: datetime.datetime
        year: 2026
        month: 1
        day: 1
      target_state:
        __type__: airflow.providers.amazon.aws.hooks.eks.ClusterStates
        __args__:
        - ACTIVE
      task_id: await_create_cluster
      timeout: 604800.0
      trigger_rule: all_success
      wait_for_downstream: false
      dependencies:
      - create_cluster
    create_nodegroup:
      operator: airflow.providers.amazon.aws.operators.eks.EksCreateNodegroupOperator
      aws_conn_id: aws_default
      cluster_name: test-cluster
      create_nodegroup_kwargs:
        launchTemplate:
          name: test-launch-template
      deferrable: false
      nodegroup_name: test-nodegroup
      nodegroup_role_arn: test-role-arn
      nodegroup_subnets:
      - subnet-12345ab
      - subnet-67890cd
      outlets: []
      priority_weight: 1
      retries: 0
      retry_delay:
        __type__: datetime.timedelta
        seconds: 300.0
      retry_exponential_backoff: false
      start_date:
        __type__: datetime.datetime
        year: 2026
        month: 1
        day: 1
      task_id: create_nodegroup
      trigger_rule: all_success
      wait_for_completion: false
      wait_for_downstream: false
      waiter_delay: 30
      waiter_max_attempts: 80
      dependencies:
      - await_create_cluster
    await_create_nodegroup:
      operator: airflow.providers.amazon.aws.sensors.eks.EksNodegroupStateSensor
      aws_conn_id: aws_default
      cluster_name: test-cluster
      mode: poke
      nodegroup_name: test-nodegroup
      outlets: []
      poke_interval: 10
      priority_weight: 1
      retries: 0
      retry_delay:
        __type__: datetime.timedelta
        seconds: 300.0
      retry_exponential_backoff: false
      start_date:
        __type__: datetime.datetime
        year: 2026
        month: 1
        day: 1
      target_state:
        __type__: airflow.providers.amazon.aws.hooks.eks.NodegroupStates
        __args__:
        - ACTIVE
      task_id: await_create_nodegroup
      timeout: 604800.0
      trigger_rule: all_success
      wait_for_downstream: false
      dependencies:
      - create_nodegroup
    delete_nodegroup:
      operator: airflow.providers.amazon.aws.operators.eks.EksDeleteNodegroupOperator
      aws_conn_id: aws_default
      cluster_name: test-cluster
      deferrable: false
      nodegroup_name: test-nodegroup
      outlets: []
      priority_weight: 1
      retries: 0
      retry_delay:
        __type__: datetime.timedelta
        seconds: 300.0
      retry_exponential_backoff: false
      start_date:
        __type__: datetime.datetime
        year: 2026
        month: 1
        day: 1
      task_id: delete_nodegroup
      trigger_rule: all_done
      wait_for_completion: false
      wait_for_downstream: false
      waiter_delay: 30
      waiter_max_attempts: 40
      dependencies:
      - await_create_nodegroup
    await_delete_nodegroup:
      operator: airflow.providers.amazon.aws.sensors.eks.EksNodegroupStateSensor
      aws_conn_id: aws_default
      cluster_name: test-cluster
      mode: poke
      nodegroup_name: test-nodegroup
      outlets: []
      poke_interval: 60.0
      priority_weight: 1
      retries: 0
      retry_delay:
        __type__: datetime.timedelta
        seconds: 300.0
      retry_exponential_backoff: false
      start_date:
        __type__: datetime.datetime
        year: 2026
        month: 1
        day: 1
      target_state:
        __type__: airflow.providers.amazon.aws.hooks.eks.NodegroupStates
        __args__:
        - NONEXISTENT
      task_id: await_delete_nodegroup
      timeout: 604800.0
      trigger_rule: all_done
      wait_for_downstream: false
      dependencies:
      - delete_nodegroup
    delete_cluster:
      operator: airflow.providers.amazon.aws.operators.eks.EksDeleteClusterOperator
      aws_conn_id: aws_default
      cluster_name: test-cluster
      deferrable: false
      force_delete_compute: false
      outlets: []
      priority_weight: 1
      retries: 0
      retry_delay:
        __type__: datetime.timedelta
        seconds: 300.0
      retry_exponential_backoff: false
      start_date:
        __type__: datetime.datetime
        year: 2026
        month: 1
        day: 1
      task_id: delete_cluster
      trigger_rule: all_done
      wait_for_completion: false
      wait_for_downstream: false
      waiter_delay: 30
      waiter_max_attempts: 40
      dependencies:
      - await_delete_nodegroup
    await_delete_cluster:
      operator: airflow.providers.amazon.aws.sensors.eks.EksClusterStateSensor
      aws_conn_id: aws_default
      cluster_name: test-cluster
      mode: poke
      outlets: []
      poke_interval: 10
      priority_weight: 1
      retries: 0
      retry_delay:
        __type__: datetime.timedelta
        seconds: 300.0
      retry_exponential_backoff: false
      start_date:
        __type__: datetime.datetime
        year: 2026
        month: 1
        day: 1
      target_state:
        __type__: airflow.providers.amazon.aws.hooks.eks.ClusterStates
        __args__:
        - NONEXISTENT
      task_id: await_delete_cluster
      timeout: 604800.0
      trigger_rule: all_done
      wait_for_downstream: false
      dependencies:
      - delete_cluster
    create_launch_template:
      decorator: airflow.providers.standard.decorators.python.python_task
      outlets: []
      priority_weight: 1
      python_callable: example_eks_with_nodegroups_taskflow.create_launch_template
      retries: 0
      retry_delay:
        __type__: datetime.timedelta
        seconds: 300.0
      retry_exponential_backoff: false
      start_date:
        __type__: datetime.datetime
        year: 2026
        month: 1
        day: 1
      task_id: create_launch_template
      trigger_rule: all_success
      wait_for_downstream: false
      multiple_outputs: false
      dependencies: []
      template_name: test-launch-template
    delete_launch_template:
      decorator: airflow.providers.standard.decorators.python.python_task
      outlets: []
      priority_weight: 1
      python_callable: example_eks_with_nodegroups_taskflow.delete_launch_template
      retries: 0
      retry_delay:
        __type__: datetime.timedelta
        seconds: 300.0
      retry_exponential_backoff: false
      start_date:
        __type__: datetime.datetime
        year: 2026
        month: 1
        day: 1
      task_id: delete_launch_template
      trigger_rule: all_done
      wait_for_downstream: false
      multiple_outputs: false
      dependencies:
      - await_delete_cluster
      template_name: test-launch-template
  catchup: false
  dag_display_name: example_eks_with_nodegroups
  owner_links: {}
  start_date:
    __type__: datetime.datetime
    year: 2026
    month: 1
    day: 1
  tags: []
