example_s3_to_sftp:
  dag_id: example_s3_to_sftp
  params: {}
  default_args:
    start_date:
      __type__: datetime.datetime
      year: 2026
      month: 1
      day: 1
  schedule: '@once'
  tasks:
    create_s3_bucket:
      operator: airflow.providers.amazon.aws.operators.s3.S3CreateBucketOperator
      task_id: create_s3_bucket
      bucket_name: test-s3-to-sftp-bucket
      dependencies: []
    create_s3_to_sftp_job:
      operator: airflow.providers.amazon.aws.transfers.s3_to_sftp.S3ToSFTPOperator
      task_id: create_s3_to_sftp_job
      sftp_path: sftp_path
      s3_bucket: test-s3-to-sftp-bucket
      s3_key: test-s3-to-sftp-key
      dependencies:
      - create_s3_bucket
    delete_s3_bucket:
      operator: airflow.providers.amazon.aws.operators.s3.S3DeleteBucketOperator
      task_id: delete_s3_bucket
      bucket_name: test-s3-to-sftp-bucket
      force_delete: true
      trigger_rule: all_done
      dependencies:
      - create_s3_to_sftp_job
  catchup: false
  dag_display_name: example_s3_to_sftp
  start_date:
    __type__: datetime.datetime
    year: 2026
    month: 1
    day: 1
  tags: []
