example_ecs_fargate:
  dag_id: example_ecs_fargate
  params: {}
  default_args:
    start_date:
      __type__: datetime.datetime
      year: 2026
      month: 1
      day: 1
  schedule: '@once'
  tasks:
    register_task_definition:
      decorator: airflow.providers.standard.decorators.python.python_task
      outlets: []
      priority_weight: 1
      python_callable: example_ecs_fargate_taskflow.register_task_definition
      retries: 0
      retry_delay:
        __type__: datetime.timedelta
        seconds: 300.0
      retry_exponential_backoff: false
      start_date:
        __type__: datetime.datetime
        year: 2026
        month: 1
        day: 1
      task_id: register_task_definition
      trigger_rule: all_success
      wait_for_downstream: false
      multiple_outputs: false
      dependencies:
      - create_cluster
      task_name: test-test-definition
      container_name: test-test-container
    hello_world:
      operator: airflow.providers.amazon.aws.operators.ecs.EcsRunTaskOperator
      aws_conn_id: aws_default
      awslogs_fetch_interval:
        __type__: datetime.timedelta
        seconds: 30.0
      cluster: test-test-cluster
      deferrable: false
      launch_type: FARGATE
      network_configuration:
        awsvpcConfiguration:
          subnets:
          - subnet-12345678
          - subnet-87654321
          securityGroups:
          - sg-12345678
          assignPublicIp: ENABLED
      number_logs_exception: 10
      outlets: []
      overrides:
        containerOverrides:
        - name: test-test-container
          command:
          - echo
          - hello
          - world
      priority_weight: 1
      reattach: false
      retries: 0
      retry_delay:
        __type__: datetime.timedelta
        seconds: 300.0
      retry_exponential_backoff: false
      start_date:
        __type__: datetime.datetime
        year: 2026
        month: 1
        day: 1
      task_definition: test-test-definition
      task_id: hello_world
      trigger_rule: all_success
      wait_for_completion: false
      wait_for_downstream: false
      waiter_delay: 6
      waiter_max_attempts: 1000000
      dependencies:
      - register_task_definition
    await_task_finish:
      operator: airflow.providers.amazon.aws.sensors.ecs.EcsTaskStateSensor
      aws_conn_id: aws_default
      cluster: test-test-cluster
      failure_states:
      - __type__: airflow.providers.amazon.aws.hooks.ecs.EcsTaskStates
        __args__:
        - NONE
      mode: poke
      outlets: []
      poke_interval: 60.0
      priority_weight: 1
      retries: 0
      retry_delay:
        __type__: datetime.timedelta
        seconds: 300.0
      retry_exponential_backoff: false
      start_date:
        __type__: datetime.datetime
        year: 2026
        month: 1
        day: 1
      target_state:
        __type__: airflow.providers.amazon.aws.hooks.ecs.EcsTaskStates
        __args__:
        - STOPPED
      task: "{{ task_instance.xcom_pull(task_ids='hello_world', key='ecs_task_arn')\
        \ }}"
      task_id: await_task_finish
      timeout: 604800.0
      trigger_rule: all_success
      wait_for_downstream: false
      dependencies:
      - hello_world
    create_cluster:
      decorator: airflow.providers.standard.decorators.python.python_task
      outlets: []
      priority_weight: 1
      python_callable: example_ecs_fargate_taskflow.create_cluster
      retries: 0
      retry_delay:
        __type__: datetime.timedelta
        seconds: 300.0
      retry_exponential_backoff: false
      start_date:
        __type__: datetime.datetime
        year: 2026
        month: 1
        day: 1
      task_id: create_cluster
      trigger_rule: all_success
      wait_for_downstream: false
      multiple_outputs: false
      dependencies: []
      cluster_name: test-test-cluster
    delete_task_definition:
      decorator: airflow.providers.standard.decorators.python.python_task
      outlets: []
      priority_weight: 1
      python_callable: example_ecs_fargate_taskflow.delete_task_definition
      retries: 0
      retry_delay:
        __type__: datetime.timedelta
        seconds: 300.0
      retry_exponential_backoff: false
      start_date:
        __type__: datetime.datetime
        year: 2026
        month: 1
        day: 1
      task_id: delete_task_definition
      trigger_rule: all_done
      wait_for_downstream: false
      multiple_outputs: false
      dependencies:
      - await_task_finish
      - register_task_definition
      task_definition_arn: +register_task_definition
    delete_cluster:
      decorator: airflow.providers.standard.decorators.python.python_task
      outlets: []
      priority_weight: 1
      python_callable: example_ecs_fargate_taskflow.delete_cluster
      retries: 0
      retry_delay:
        __type__: datetime.timedelta
        seconds: 300.0
      retry_exponential_backoff: false
      start_date:
        __type__: datetime.datetime
        year: 2026
        month: 1
        day: 1
      task_id: delete_cluster
      trigger_rule: all_done
      wait_for_downstream: false
      multiple_outputs: false
      dependencies:
      - delete_task_definition
      cluster_name: test-test-cluster
  catchup: false
  dag_display_name: example_ecs_fargate
  owner_links: {}
  start_date:
    __type__: datetime.datetime
    year: 2026
    month: 1
    day: 1
  tags: []
