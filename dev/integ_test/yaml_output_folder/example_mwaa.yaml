example_mwaa:
  dag_id: example_mwaa
  params: {}
  default_args:
    start_date:
      __type__: datetime.datetime
      year: 2026
      month: 1
      day: 1
  schedule: '@once'
  tasks:
    trigger_dag_run:
      operator: airflow.providers.amazon.aws.operators.mwaa.MwaaTriggerDagRunOperator
      aws_conn_id: aws_default
      conf: {}
      deferrable: false
      env_name: test-environment-name
      outlets: []
      priority_weight: 1
      retries: 0
      retry_delay:
        __type__: datetime.timedelta
        seconds: 300.0
      retry_exponential_backoff: false
      start_date:
        __type__: datetime.datetime
        year: 2026
        month: 1
        day: 1
      task_id: trigger_dag_run
      trigger_dag_id: test-dag-id
      trigger_rule: all_success
      wait_for_completion: true
      wait_for_downstream: false
      waiter_delay: 60
      waiter_max_attempts: 20
      dependencies:
      - unpause_dag
    wait_for_dag_run:
      operator: airflow.providers.amazon.aws.sensors.mwaa.MwaaDagRunSensor
      aws_conn_id: aws_default
      deferrable: false
      external_dag_id: test-dag-id
      external_dag_run_id: "{{ task_instance.xcom_pull(task_ids='trigger_dag_run')['RestApiResponse']['dag_run_id']\
        \ }}"
      external_env_name: test-environment-name
      max_retries: 720
      mode: poke
      outlets: []
      poke_interval: 5
      priority_weight: 1
      retries: 0
      retry_delay:
        __type__: datetime.timedelta
        seconds: 300.0
      retry_exponential_backoff: false
      start_date:
        __type__: datetime.datetime
        year: 2026
        month: 1
        day: 1
      task_id: wait_for_dag_run
      timeout: 604800.0
      trigger_rule: all_success
      wait_for_downstream: false
      dependencies:
      - trigger_dag_run
    unpause_dag:
      decorator: airflow.providers.standard.decorators.python.python_task
      outlets: []
      priority_weight: 1
      python_callable: example_mwaa_taskflow.unpause_dag
      retries: 0
      retry_delay:
        __type__: datetime.timedelta
        seconds: 300.0
      retry_exponential_backoff: false
      start_date:
        __type__: datetime.datetime
        year: 2026
        month: 1
        day: 1
      task_id: unpause_dag
      trigger_rule: all_success
      wait_for_downstream: false
      multiple_outputs: false
      dependencies: []
      env_name: test-environment-name
      dag_id: test-dag-id
    test_iam_fallback:
      decorator: airflow.providers.standard.decorators.python.python_task
      outlets: []
      priority_weight: 1
      python_callable: example_mwaa_taskflow.test_iam_fallback
      retries: 0
      retry_delay:
        __type__: datetime.timedelta
        seconds: 300.0
      retry_exponential_backoff: false
      start_date:
        __type__: datetime.datetime
        year: 2026
        month: 1
        day: 1
      task_id: test_iam_fallback
      trigger_rule: all_success
      wait_for_downstream: false
      multiple_outputs: false
      dependencies:
      - wait_for_dag_run
      role_to_assume_arn: test-restricted-role-arn
      mwaa_env_name: test-environment-name
  catchup: false
  dag_display_name: example_mwaa
  owner_links: {}
  start_date:
    __type__: datetime.datetime
    year: 2026
    month: 1
    day: 1
  tags: []
