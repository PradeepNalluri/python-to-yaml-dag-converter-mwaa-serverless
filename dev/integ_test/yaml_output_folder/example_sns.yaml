example_sns:
  dag_id: example_sns
  params: {}
  default_args:
    start_date:
      __type__: datetime.datetime
      year: 2026
      month: 1
      day: 1
  schedule: '@once'
  tasks:
    create_topic:
      decorator: airflow.providers.standard.decorators.python.python_task
      outlets: []
      priority_weight: 1
      python_callable: example_sns_taskflow.create_topic
      retries: 0
      retry_delay:
        __type__: datetime.timedelta
        seconds: 300.0
      retry_exponential_backoff: false
      start_date:
        __type__: datetime.datetime
        year: 2026
        month: 1
        day: 1
      task_id: create_topic
      trigger_rule: all_success
      wait_for_downstream: false
      multiple_outputs: false
      dependencies: []
      topic_name: test-test-topic
    publish_message:
      operator: airflow.providers.amazon.aws.operators.sns.SnsPublishOperator
      aws_conn_id: aws_default
      message: This is a sample message sent to SNS via an Apache Airflow DAG task.
      outlets: []
      priority_weight: 1
      retries: 0
      retry_delay:
        __type__: datetime.timedelta
        seconds: 300.0
      retry_exponential_backoff: false
      start_date:
        __type__: datetime.datetime
        year: 2026
        month: 1
        day: 1
      target_arn: "{{ task_instance.xcom_pull(task_ids='create_topic', key='return_value')\
        \ }}"
      task_id: publish_message
      trigger_rule: all_success
      wait_for_downstream: false
      dependencies:
      - create_topic
    delete_topic:
      decorator: airflow.providers.standard.decorators.python.python_task
      outlets: []
      priority_weight: 1
      python_callable: example_sns_taskflow.delete_topic
      retries: 0
      retry_delay:
        __type__: datetime.timedelta
        seconds: 300.0
      retry_exponential_backoff: false
      start_date:
        __type__: datetime.datetime
        year: 2026
        month: 1
        day: 1
      task_id: delete_topic
      trigger_rule: all_done
      wait_for_downstream: false
      multiple_outputs: false
      dependencies:
      - create_topic
      - publish_message
      topic_arn: +create_topic
  catchup: false
  dag_display_name: example_sns
  owner_links: {}
  start_date:
    __type__: datetime.datetime
    year: 2026
    month: 1
    day: 1
  tags: []
