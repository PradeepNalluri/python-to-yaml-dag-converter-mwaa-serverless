sample_dag:
  dag_id: sample_dag
  params:
    names:
    - Linda
    - Martha
    - Thomas
    english: true
    german: true
    french: true
  default_args:
    owner: airflow
    start_date:
      __type__: datetime.datetime
      year: 2026
      month: 1
      day: 1
    retries: 1
    retry_delay:
      __type__: datetime.timedelta
      seconds: 300.0
  schedule: '@daily'
  tasks:
    task1:
      operator: airflow.providers.standard.operators.python.PythonOperator
      op_args:
      - 42
      op_kwargs: {}
      outlets: []
      priority_weight: 1
      python_callable: param.my_function
      retries: 1
      retry_delay:
        __type__: datetime.timedelta
        seconds: 300.0
      retry_exponential_backoff: false
      start_date:
        __type__: datetime.datetime
        year: 2026
        month: 1
        day: 1
      task_id: task1
      trigger_rule: all_success
      wait_for_downstream: false
      dependencies: []
  catchup: false
  dag_display_name: sample_dag
  owner_links: {}
  start_date:
    __type__: datetime.datetime
    year: 2026
    month: 1
    day: 1
  tags: []
