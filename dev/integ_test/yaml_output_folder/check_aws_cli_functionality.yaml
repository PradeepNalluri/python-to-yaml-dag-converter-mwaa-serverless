check_aws_cli_functionality:
  dag_id: check_aws_cli_functionality
  params: {}
  default_args:
    start_date:
      __type__: datetime.datetime
      year: 2026
      month: 1
      day: 1
  schedule: '@once'
  tasks:
    display_cli_version:
      operator: airflow.providers.standard.operators.bash.BashOperator
      bash_command: aws --version
      outlets: []
      priority_weight: 1
      retries: 0
      retry_delay:
        __type__: datetime.timedelta
        seconds: 300.0
      retry_exponential_backoff: false
      start_date:
        __type__: datetime.datetime
        year: 2026
        month: 1
        day: 1
      task_id: display_cli_version
      trigger_rule: all_success
      wait_for_downstream: false
      dependencies: []
    check_json_output:
      operator: airflow.providers.standard.operators.bash.BashOperator
      bash_command: aws mwaa list-environments --region $AWS_REGION --output json
      outlets: []
      priority_weight: 1
      retries: 0
      retry_delay:
        __type__: datetime.timedelta
        seconds: 300.0
      retry_exponential_backoff: false
      start_date:
        __type__: datetime.datetime
        year: 2026
        month: 1
        day: 1
      task_id: check_json_output
      trigger_rule: all_success
      wait_for_downstream: false
      dependencies:
      - display_cli_version
    check_yaml_output:
      operator: airflow.providers.standard.operators.bash.BashOperator
      bash_command: aws mwaa list-environments --region $AWS_REGION --output yaml
      outlets: []
      priority_weight: 1
      retries: 0
      retry_delay:
        __type__: datetime.timedelta
        seconds: 300.0
      retry_exponential_backoff: false
      start_date:
        __type__: datetime.datetime
        year: 2026
        month: 1
        day: 1
      task_id: check_yaml_output
      trigger_rule: all_success
      wait_for_downstream: false
      dependencies:
      - check_json_output
  catchup: false
  dag_display_name: check_aws_cli_functionality
  dagrun_timeout:
    __type__: datetime.timedelta
    seconds: 300.0
  owner_links: {}
  start_date:
    __type__: datetime.datetime
    year: 2026
    month: 1
    day: 1
  tags: []
