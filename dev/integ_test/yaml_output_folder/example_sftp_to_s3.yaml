example_sftp_to_s3:
  dag_id: example_sftp_to_s3
  params: {}
  default_args:
    start_date:
      __type__: datetime.datetime
      year: 2026
      month: 1
      day: 1
  schedule: '@once'
  tasks:
    create_s3_bucket:
      operator: airflow.providers.amazon.aws.operators.s3.S3CreateBucketOperator
      aws_conn_id: aws_default
      bucket_name: test-sftp-to-s3-bucket
      outlets: []
      priority_weight: 1
      retries: 0
      retry_delay:
        __type__: datetime.timedelta
        seconds: 300.0
      retry_exponential_backoff: false
      start_date:
        __type__: datetime.datetime
        year: 2026
        month: 1
        day: 1
      task_id: create_s3_bucket
      trigger_rule: all_success
      wait_for_downstream: false
      dependencies: []
    sftp_to_s3_job:
      operator: airflow.providers.amazon.aws.transfers.sftp_to_s3.SFTPToS3Operator
      aws_conn_id: aws_default
      encrypt: false
      fail_on_file_not_exist: true
      gzip: false
      outlets: []
      priority_weight: 1
      replace: false
      retries: 0
      retry_delay:
        __type__: datetime.timedelta
        seconds: 300.0
      retry_exponential_backoff: false
      s3_bucket: test-sftp-to-s3-bucket
      s3_key: test-sftp-to-s3-key
      sftp_conn_id: ssh_default
      sftp_path: /tmp/sftp_path
      start_date:
        __type__: datetime.datetime
        year: 2026
        month: 1
        day: 1
      task_id: sftp_to_s3_job
      trigger_rule: all_success
      use_temp_file: true
      wait_for_downstream: false
      dependencies:
      - create_s3_bucket
    delete_s3_bucket:
      operator: airflow.providers.amazon.aws.operators.s3.S3DeleteBucketOperator
      aws_conn_id: aws_default
      bucket_name: test-sftp-to-s3-bucket
      force_delete: true
      outlets: []
      priority_weight: 1
      retries: 0
      retry_delay:
        __type__: datetime.timedelta
        seconds: 300.0
      retry_exponential_backoff: false
      start_date:
        __type__: datetime.datetime
        year: 2026
        month: 1
        day: 1
      task_id: delete_s3_bucket
      trigger_rule: all_done
      wait_for_downstream: false
      dependencies:
      - sftp_to_s3_job
  catchup: false
  dag_display_name: example_sftp_to_s3
  owner_links: {}
  start_date:
    __type__: datetime.datetime
    year: 2026
    month: 1
    day: 1
  tags: []
