example_s3_to_sql:
  dag_id: example_s3_to_sql
  params: {}
  default_args:
    start_date:
      __type__: datetime.datetime
      year: 2026
      month: 1
      day: 1
  schedule: '@once'
  tasks:
    create_cluster:
      operator: airflow.providers.amazon.aws.operators.redshift_cluster.RedshiftCreateClusterOperator
      allow_version_upgrade: true
      automated_snapshot_retention_period: 1
      aws_conn_id: aws_default
      cluster_identifier: test-redshift-cluster
      cluster_subnet_group_name: test-cluster-subnet-group
      cluster_type: single-node
      cluster_version: '1.0'
      db_name: dev
      deferrable: false
      encrypted: false
      enhanced_vpc_routing: false
      master_user_password: MyAmazonPassword1
      master_username: adminuser
      max_attempt: 5
      node_type: dc2.large
      number_of_nodes: 1
      outlets: []
      poll_interval: 60
      port: 5439
      priority_weight: 1
      publicly_accessible: true
      retries: 0
      retry_delay:
        __type__: datetime.timedelta
        seconds: 300.0
      retry_exponential_backoff: false
      start_date:
        __type__: datetime.datetime
        year: 2026
        month: 1
        day: 1
      task_id: create_cluster
      trigger_rule: all_success
      vpc_security_group_ids:
      - test-security-group
      wait_for_completion: false
      wait_for_downstream: false
      dependencies: []
    wait_cluster_available:
      operator: airflow.providers.amazon.aws.sensors.redshift_cluster.RedshiftClusterSensor
      aws_conn_id: aws_default
      cluster_identifier: test-redshift-cluster
      deferrable: false
      mode: poke
      outlets: []
      poke_interval: 5
      priority_weight: 1
      retries: 0
      retry_delay:
        __type__: datetime.timedelta
        seconds: 300.0
      retry_exponential_backoff: false
      start_date:
        __type__: datetime.datetime
        year: 2026
        month: 1
        day: 1
      target_status: available
      task_id: wait_cluster_available
      timeout: 1800
      trigger_rule: all_success
      wait_for_downstream: false
      dependencies:
      - create_cluster
    create_connection:
      decorator: airflow.providers.standard.decorators.python.python_task
      outlets: []
      priority_weight: 1
      python_callable: example_s3_to_sql_taskflow.create_connection
      retries: 0
      retry_delay:
        __type__: datetime.timedelta
        seconds: 300.0
      retry_exponential_backoff: false
      start_date:
        __type__: datetime.datetime
        year: 2026
        month: 1
        day: 1
      task_id: create_connection
      trigger_rule: all_success
      wait_for_downstream: false
      multiple_outputs: false
      dependencies:
      - wait_cluster_available
      conn_id_name: aws_default
      cluster_id: test-redshift-cluster
    create_bucket:
      operator: airflow.providers.amazon.aws.operators.s3.S3CreateBucketOperator
      aws_conn_id: aws_default
      bucket_name: test-bucket
      outlets: []
      priority_weight: 1
      retries: 0
      retry_delay:
        __type__: datetime.timedelta
        seconds: 300.0
      retry_exponential_backoff: false
      start_date:
        __type__: datetime.datetime
        year: 2026
        month: 1
        day: 1
      task_id: create_bucket
      trigger_rule: all_success
      wait_for_downstream: false
      dependencies:
      - create_connection
    create_object:
      operator: airflow.providers.amazon.aws.operators.s3.S3CreateObjectOperator
      aws_conn_id: aws_default
      data: |
        1,Caipirinha,Cachaca
        2,Bramble,Gin
        3,Daiquiri,Rum
      encrypt: false
      outlets: []
      priority_weight: 1
      replace: true
      retries: 0
      retry_delay:
        __type__: datetime.timedelta
        seconds: 300.0
      retry_exponential_backoff: false
      s3_bucket: test-bucket
      s3_key: test/files/cocktail_list.csv
      start_date:
        __type__: datetime.datetime
        year: 2026
        month: 1
        day: 1
      task_id: create_object
      trigger_rule: all_success
      wait_for_downstream: false
      dependencies:
      - create_bucket
    create_sample_table:
      operator: airflow.providers.amazon.aws.operators.redshift_data.RedshiftDataOperator
      aws_conn_id: aws_default
      cluster_identifier: test-redshift-cluster
      database: dev
      db_user: adminuser
      deferrable: false
      outlets: []
      poll_interval: 10
      priority_weight: 1
      retries: 0
      retry_delay:
        __type__: datetime.timedelta
        seconds: 300.0
      retry_exponential_backoff: false
      return_sql_result: false
      sql: "\n            CREATE TABLE IF NOT EXISTS cocktails (\n            cocktail_id\
        \ INT NOT NULL,\n            cocktail_name VARCHAR NOT NULL,\n           \
        \ base_spirit VARCHAR NOT NULL);\n        "
      start_date:
        __type__: datetime.datetime
        year: 2026
        month: 1
        day: 1
      task_id: create_sample_table
      trigger_rule: all_success
      wait_for_completion: true
      wait_for_downstream: false
      with_event: false
      dependencies:
      - create_object
    transfer_s3_to_sql:
      operator: airflow.providers.amazon.aws.transfers.s3_to_sql.S3ToSqlOperator
      aws_conn_id: aws_default
      column_list:
      - cocktail_id
      - cocktail_name
      - base_spirit
      commit_every: 1000
      outlets: []
      parser: airflow_s3_to_sql.parse_csv_to_list
      priority_weight: 1
      retries: 0
      retry_delay:
        __type__: datetime.timedelta
        seconds: 300.0
      retry_exponential_backoff: false
      s3_bucket: test-bucket
      s3_key: test/files/cocktail_list.csv
      sql_conn_id: aws_default
      start_date:
        __type__: datetime.datetime
        year: 2026
        month: 1
        day: 1
      table: cocktails
      task_id: transfer_s3_to_sql
      trigger_rule: all_success
      wait_for_downstream: false
      dependencies:
      - create_sample_table
    transfer_s3_to_sql_paser_to_generator:
      operator: airflow.providers.amazon.aws.transfers.s3_to_sql.S3ToSqlOperator
      aws_conn_id: aws_default
      column_list:
      - cocktail_id
      - cocktail_name
      - base_spirit
      commit_every: 1000
      outlets: []
      parser: airflow_s3_to_sql.parse_csv_to_generator
      priority_weight: 1
      retries: 0
      retry_delay:
        __type__: datetime.timedelta
        seconds: 300.0
      retry_exponential_backoff: false
      s3_bucket: test-bucket
      s3_key: test/files/cocktail_list.csv
      sql_conn_id: aws_default
      start_date:
        __type__: datetime.datetime
        year: 2026
        month: 1
        day: 1
      table: cocktails
      task_id: transfer_s3_to_sql_paser_to_generator
      trigger_rule: all_success
      wait_for_downstream: false
      dependencies:
      - transfer_s3_to_sql
    check_table:
      operator: airflow.providers.common.sql.operators.sql.SQLTableCheckOperator
      hook_params: {}
      outlets: []
      priority_weight: 1
      retries: 0
      retry_delay:
        __type__: datetime.timedelta
        seconds: 300.0
      retry_exponential_backoff: false
      start_date:
        __type__: datetime.datetime
        year: 2026
        month: 1
        day: 1
      table: cocktails
      task_id: check_table
      trigger_rule: all_success
      wait_for_downstream: false
      conn_id: aws_default
      checks:
        row_count_check:
          check_statement: COUNT(*) = 6
      dependencies:
      - transfer_s3_to_sql_paser_to_generator
    drop_table:
      operator: airflow.providers.amazon.aws.operators.redshift_data.RedshiftDataOperator
      aws_conn_id: aws_default
      cluster_identifier: test-redshift-cluster
      database: dev
      db_user: adminuser
      deferrable: false
      outlets: []
      poll_interval: 10
      priority_weight: 1
      retries: 0
      retry_delay:
        __type__: datetime.timedelta
        seconds: 300.0
      retry_exponential_backoff: false
      return_sql_result: false
      sql: DROP TABLE cocktails
      start_date:
        __type__: datetime.datetime
        year: 2026
        month: 1
        day: 1
      task_id: drop_table
      trigger_rule: all_success
      wait_for_completion: true
      wait_for_downstream: false
      with_event: false
      dependencies:
      - check_table
    delete_objects:
      operator: airflow.providers.amazon.aws.operators.s3.S3DeleteObjectsOperator
      aws_conn_id: aws_default
      bucket: test-bucket
      keys: test/files/cocktail_list.csv
      outlets: []
      priority_weight: 1
      retries: 0
      retry_delay:
        __type__: datetime.timedelta
        seconds: 300.0
      retry_exponential_backoff: false
      start_date:
        __type__: datetime.datetime
        year: 2026
        month: 1
        day: 1
      task_id: delete_objects
      trigger_rule: all_done
      wait_for_downstream: false
      dependencies:
      - drop_table
    delete_bucket:
      operator: airflow.providers.amazon.aws.operators.s3.S3DeleteBucketOperator
      aws_conn_id: aws_default
      bucket_name: test-bucket
      force_delete: true
      outlets: []
      priority_weight: 1
      retries: 0
      retry_delay:
        __type__: datetime.timedelta
        seconds: 300.0
      retry_exponential_backoff: false
      start_date:
        __type__: datetime.datetime
        year: 2026
        month: 1
        day: 1
      task_id: delete_bucket
      trigger_rule: all_done
      wait_for_downstream: false
      dependencies:
      - delete_objects
    delete_cluster:
      operator: airflow.providers.amazon.aws.operators.redshift_cluster.RedshiftDeleteClusterOperator
      aws_conn_id: aws_default
      cluster_identifier: test-redshift-cluster
      deferrable: false
      max_attempts: 30
      outlets: []
      poll_interval: 30
      priority_weight: 1
      retries: 0
      retry_delay:
        __type__: datetime.timedelta
        seconds: 300.0
      retry_exponential_backoff: false
      skip_final_cluster_snapshot: true
      start_date:
        __type__: datetime.datetime
        year: 2026
        month: 1
        day: 1
      task_id: delete_cluster
      trigger_rule: all_done
      wait_for_completion: true
      wait_for_downstream: false
      dependencies:
      - delete_bucket
  catchup: false
  dag_display_name: example_s3_to_sql
  owner_links: {}
  start_date:
    __type__: datetime.datetime
    year: 2026
    month: 1
    day: 1
  tags: []
