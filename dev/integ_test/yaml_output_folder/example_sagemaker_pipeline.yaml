example_sagemaker_pipeline:
  dag_id: example_sagemaker_pipeline
  params: {}
  default_args:
    start_date:
      __type__: datetime.datetime
      year: 2026
      month: 1
      day: 1
  schedule: '@once'
  tasks:
    create_pipeline:
      decorator: airflow.providers.standard.decorators.python.python_task
      outlets: []
      priority_weight: 1
      python_callable: example_sagemaker_pipeline_taskflow.create_pipeline
      retries: 0
      retry_delay:
        __type__: datetime.timedelta
        seconds: 300.0
      retry_exponential_backoff: false
      start_date:
        __type__: datetime.datetime
        year: 2026
        month: 1
        day: 1
      task_id: create_pipeline
      trigger_rule: all_success
      wait_for_downstream: false
      multiple_outputs: false
      dependencies: []
      name: test-pipeline
      role_arn: test-role-arn
    start_pipeline1:
      operator: airflow.providers.amazon.aws.operators.sagemaker.SageMakerStartPipelineOperator
      aws_conn_id: aws_default
      check_interval: 30
      deferrable: false
      display_name: airflow-triggered-execution
      outlets: []
      pipeline_name: test-pipeline
      priority_weight: 1
      retries: 0
      retry_delay:
        __type__: datetime.timedelta
        seconds: 300.0
      retry_exponential_backoff: false
      start_date:
        __type__: datetime.datetime
        year: 2026
        month: 1
        day: 1
      task_id: start_pipeline1
      trigger_rule: all_success
      verbose: true
      wait_for_completion: false
      wait_for_downstream: false
      waiter_max_attempts: 9999
      dependencies:
      - create_pipeline
    stop_pipeline1:
      operator: airflow.providers.amazon.aws.operators.sagemaker.SageMakerStopPipelineOperator
      aws_conn_id: aws_default
      check_interval: 30
      deferrable: false
      fail_if_not_running: false
      outlets: []
      pipeline_exec_arn: "{{ task_instance.xcom_pull(task_ids='start_pipeline1', key='return_value')\
        \ }}"
      priority_weight: 1
      retries: 0
      retry_delay:
        __type__: datetime.timedelta
        seconds: 300.0
      retry_exponential_backoff: false
      start_date:
        __type__: datetime.datetime
        year: 2026
        month: 1
        day: 1
      task_id: stop_pipeline1
      trigger_rule: all_success
      verbose: true
      wait_for_completion: false
      wait_for_downstream: false
      waiter_max_attempts: 9999
      dependencies:
      - start_pipeline2
      - start_pipeline1
    start_pipeline2:
      operator: airflow.providers.amazon.aws.operators.sagemaker.SageMakerStartPipelineOperator
      aws_conn_id: aws_default
      check_interval: 30
      deferrable: false
      display_name: airflow-triggered-execution
      outlets: []
      pipeline_name: test-pipeline
      priority_weight: 1
      retries: 0
      retry_delay:
        __type__: datetime.timedelta
        seconds: 300.0
      retry_exponential_backoff: false
      start_date:
        __type__: datetime.datetime
        year: 2026
        month: 1
        day: 1
      task_id: start_pipeline2
      trigger_rule: all_success
      verbose: true
      wait_for_completion: false
      wait_for_downstream: false
      waiter_max_attempts: 9999
      dependencies:
      - start_pipeline1
    await_pipeline2:
      operator: airflow.providers.amazon.aws.sensors.sagemaker.SageMakerPipelineSensor
      aws_conn_id: aws_default
      mode: poke
      outlets: []
      pipeline_exec_arn: "{{ task_instance.xcom_pull(task_ids='start_pipeline2', key='return_value')\
        \ }}"
      poke_interval: 10
      priority_weight: 1
      retries: 0
      retry_delay:
        __type__: datetime.timedelta
        seconds: 300.0
      retry_exponential_backoff: false
      start_date:
        __type__: datetime.datetime
        year: 2026
        month: 1
        day: 1
      task_id: await_pipeline2
      timeout: 604800.0
      trigger_rule: all_success
      verbose: true
      wait_for_downstream: false
      dependencies:
      - stop_pipeline1
      - start_pipeline2
    delete_pipeline:
      decorator: airflow.providers.standard.decorators.python.python_task
      outlets: []
      priority_weight: 1
      python_callable: example_sagemaker_pipeline_taskflow.delete_pipeline
      retries: 0
      retry_delay:
        __type__: datetime.timedelta
        seconds: 300.0
      retry_exponential_backoff: false
      start_date:
        __type__: datetime.datetime
        year: 2026
        month: 1
        day: 1
      task_id: delete_pipeline
      trigger_rule: all_done
      wait_for_downstream: false
      multiple_outputs: false
      dependencies:
      - await_pipeline2
      name: test-pipeline
    delete_experiments:
      decorator: airflow.providers.standard.decorators.python.python_task
      outlets: []
      priority_weight: 1
      python_callable: example_sagemaker_pipeline_taskflow.delete_experiments
      retries: 0
      retry_delay:
        __type__: datetime.timedelta
        seconds: 300.0
      retry_exponential_backoff: false
      start_date:
        __type__: datetime.datetime
        year: 2026
        month: 1
        day: 1
      task_id: delete_experiments
      trigger_rule: all_done
      wait_for_downstream: false
      multiple_outputs: false
      dependencies:
      - delete_pipeline
      experiment_names:
      - test-pipeline
  catchup: false
  dag_display_name: example_sagemaker_pipeline
  owner_links: {}
  start_date:
    __type__: datetime.datetime
    year: 2026
    month: 1
    day: 1
  tags: []
