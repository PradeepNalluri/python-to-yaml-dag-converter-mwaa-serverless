example_gcs_to_s3:
  dag_id: example_gcs_to_s3
  params: {}
  default_args:
    start_date:
      __type__: datetime.datetime
      year: 2026
      month: 1
      day: 1
  schedule: '@once'
  tasks:
    create_s3_bucket:
      operator: airflow.providers.amazon.aws.operators.s3.S3CreateBucketOperator
      aws_conn_id: aws_default
      bucket_name: test-gcs-to-s3-bucket
      outlets: []
      priority_weight: 1
      retries: 0
      retry_delay:
        __type__: datetime.timedelta
        seconds: 300.0
      retry_exponential_backoff: false
      start_date:
        __type__: datetime.datetime
        year: 2026
        month: 1
        day: 1
      task_id: create_s3_bucket
      trigger_rule: all_success
      wait_for_downstream: false
      dependencies:
      - upload_gcs_file
    create_gcs_bucket:
      operator: airflow.providers.google.cloud.operators.gcs.GCSCreateBucketOperator
      bucket_name: test-gcs-to-s3-bucket
      gcp_conn_id: google_cloud_default
      outlets: []
      priority_weight: 1
      retries: 0
      retry_delay:
        __type__: datetime.timedelta
        seconds: 300.0
      retry_exponential_backoff: false
      start_date:
        __type__: datetime.datetime
        year: 2026
        month: 1
        day: 1
      task_id: create_gcs_bucket
      trigger_rule: all_success
      wait_for_downstream: false
      resource:
        billing:
          requesterPays: true
      project_id: test-gcp-project
      dependencies: []
    gcs_to_s3:
      operator: airflow.providers.amazon.aws.transfers.gcs_to_s3.GCSToS3Operator
      dest_aws_conn_id: aws_default
      dest_s3_extra_args: {}
      dest_s3_key: s3://test-gcs-to-s3-bucket/test-gcs-to-s3-key
      gcp_conn_id: google_cloud_default
      gcp_user_project: test-gcp-project
      gcs_bucket: test-gcs-to-s3-bucket
      keep_directory_structure: true
      outlets: []
      priority_weight: 1
      replace: true
      retries: 0
      retry_delay:
        __type__: datetime.timedelta
        seconds: 300.0
      retry_exponential_backoff: false
      start_date:
        __type__: datetime.datetime
        year: 2026
        month: 1
        day: 1
      task_id: gcs_to_s3
      trigger_rule: all_success
      wait_for_downstream: false
      dependencies:
      - create_s3_bucket
    delete_s3_bucket:
      operator: airflow.providers.amazon.aws.operators.s3.S3DeleteBucketOperator
      aws_conn_id: aws_default
      bucket_name: test-gcs-to-s3-bucket
      force_delete: true
      outlets: []
      priority_weight: 1
      retries: 0
      retry_delay:
        __type__: datetime.timedelta
        seconds: 300.0
      retry_exponential_backoff: false
      start_date:
        __type__: datetime.datetime
        year: 2026
        month: 1
        day: 1
      task_id: delete_s3_bucket
      trigger_rule: all_done
      wait_for_downstream: false
      dependencies:
      - gcs_to_s3
    delete_gcs_bucket:
      operator: airflow.providers.google.cloud.operators.gcs.GCSDeleteBucketOperator
      bucket_name: test-gcs-to-s3-bucket
      force: true
      gcp_conn_id: google_cloud_default
      outlets: []
      priority_weight: 1
      retries: 0
      retry_delay:
        __type__: datetime.timedelta
        seconds: 300.0
      retry_exponential_backoff: false
      start_date:
        __type__: datetime.datetime
        year: 2026
        month: 1
        day: 1
      task_id: delete_gcs_bucket
      trigger_rule: all_done
      wait_for_downstream: false
      user_project: test-gcp-project
      dependencies:
      - delete_s3_bucket
    upload_gcs_file:
      decorator: airflow.providers.standard.decorators.python.python_task
      outlets: []
      priority_weight: 1
      python_callable: example_gcs_to_s3_taskflow.upload_gcs_file
      retries: 0
      retry_delay:
        __type__: datetime.timedelta
        seconds: 300.0
      retry_exponential_backoff: false
      start_date:
        __type__: datetime.datetime
        year: 2026
        month: 1
        day: 1
      task_id: upload_gcs_file
      trigger_rule: all_success
      wait_for_downstream: false
      multiple_outputs: false
      dependencies:
      - create_gcs_bucket
      bucket_name: test-gcs-to-s3-bucket
      object_name: test-gcs-to-s3-key
      user_project: test-gcp-project
  catchup: false
  dag_display_name: example_gcs_to_s3
  owner_links: {}
  start_date:
    __type__: datetime.datetime
    year: 2026
    month: 1
    day: 1
  tags: []
