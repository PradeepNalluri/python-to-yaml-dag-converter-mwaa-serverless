example_rds_event:
  dag_id: example_rds_event
  params: {}
  default_args:
    start_date:
      __type__: datetime.datetime
      year: 2026
      month: 1
      day: 1
  schedule: '@once'
  tasks:
    create_sns_topic:
      decorator: airflow.providers.standard.decorators.python.python_task
      outlets: []
      priority_weight: 1
      python_callable: example_rds_event_taskflow.create_sns_topic
      retries: 0
      retry_delay:
        __type__: datetime.timedelta
        seconds: 300.0
      retry_exponential_backoff: false
      start_date:
        __type__: datetime.datetime
        year: 2026
        month: 1
        day: 1
      task_id: create_sns_topic
      trigger_rule: all_success
      wait_for_downstream: false
      multiple_outputs: false
      dependencies: []
      env_id: test
    create_db_instance:
      operator: airflow.providers.amazon.aws.operators.rds.RdsCreateDbInstanceOperator
      aws_conn_id: aws_default
      db_instance_class: db.t4g.micro
      db_instance_identifier: test-instance
      deferrable: false
      engine: postgres
      outlets: []
      priority_weight: 1
      rds_kwargs:
        MasterUsername: rds_username
        MasterUserPassword: rds_password
        AllocatedStorage: 20
        DBName: test_db
        PubliclyAccessible: false
      retries: 0
      retry_delay:
        __type__: datetime.timedelta
        seconds: 300.0
      retry_exponential_backoff: false
      start_date:
        __type__: datetime.datetime
        year: 2026
        month: 1
        day: 1
      task_id: create_db_instance
      trigger_rule: all_success
      wait_for_completion: true
      wait_for_downstream: false
      waiter_delay: 30
      waiter_max_attempts: 60
      dependencies:
      - create_sns_topic
    create_subscription:
      operator: airflow.providers.amazon.aws.operators.rds.RdsCreateEventSubscriptionOperator
      aws_conn_id: aws_default
      enabled: true
      event_categories:
      - availability
      outlets: []
      priority_weight: 1
      retries: 0
      retry_delay:
        __type__: datetime.timedelta
        seconds: 300.0
      retry_exponential_backoff: false
      sns_topic_arn: "{{ task_instance.xcom_pull(task_ids='create_sns_topic', key='return_value')\
        \ }}"
      source_ids:
      - test-instance
      source_type: db-instance
      start_date:
        __type__: datetime.datetime
        year: 2026
        month: 1
        day: 1
      subscription_name: test-subscription
      task_id: create_subscription
      trigger_rule: all_success
      wait_for_completion: true
      wait_for_downstream: false
      dependencies:
      - create_db_instance
      - create_sns_topic
    delete_subscription:
      operator: airflow.providers.amazon.aws.operators.rds.RdsDeleteEventSubscriptionOperator
      aws_conn_id: aws_default
      outlets: []
      priority_weight: 1
      retries: 0
      retry_delay:
        __type__: datetime.timedelta
        seconds: 300.0
      retry_exponential_backoff: false
      start_date:
        __type__: datetime.datetime
        year: 2026
        month: 1
        day: 1
      subscription_name: test-subscription
      task_id: delete_subscription
      trigger_rule: all_done
      wait_for_downstream: false
      dependencies:
      - create_subscription
    delete_db_instance:
      operator: airflow.providers.amazon.aws.operators.rds.RdsDeleteDbInstanceOperator
      aws_conn_id: aws_default
      db_instance_identifier: test-instance
      deferrable: false
      outlets: []
      priority_weight: 1
      rds_kwargs:
        SkipFinalSnapshot: true
      retries: 0
      retry_delay:
        __type__: datetime.timedelta
        seconds: 300.0
      retry_exponential_backoff: false
      start_date:
        __type__: datetime.datetime
        year: 2026
        month: 1
        day: 1
      task_id: delete_db_instance
      trigger_rule: all_done
      wait_for_completion: true
      wait_for_downstream: false
      waiter_delay: 30
      waiter_max_attempts: 60
      dependencies:
      - delete_subscription
    delete_sns_topic:
      decorator: airflow.providers.standard.decorators.python.python_task
      outlets: []
      priority_weight: 1
      python_callable: example_rds_event_taskflow.delete_sns_topic
      retries: 0
      retry_delay:
        __type__: datetime.timedelta
        seconds: 300.0
      retry_exponential_backoff: false
      start_date:
        __type__: datetime.datetime
        year: 2026
        month: 1
        day: 1
      task_id: delete_sns_topic
      trigger_rule: all_done
      wait_for_downstream: false
      multiple_outputs: false
      dependencies:
      - delete_db_instance
      - create_sns_topic
      topic_arn: +create_sns_topic
  catchup: false
  dag_display_name: example_rds_event
  owner_links: {}
  start_date:
    __type__: datetime.datetime
    year: 2026
    month: 1
    day: 1
  tags: []
