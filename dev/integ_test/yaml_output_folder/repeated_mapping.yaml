repeated_mapping:
  dag_id: repeated_mapping
  params: {}
  default_args:
    start_date:
      __type__: datetime.datetime
      year: 2026
      month: 4
      day: 2
  schedule: '@daily'
  tasks:
    add:
      decorator: airflow.providers.standard.decorators.python.python_task
      outlets: []
      priority_weight: 1
      python_callable: repeated_mapping_taskflow.add
      retries: 0
      retry_delay:
        __type__: datetime.timedelta
        seconds: 300.0
      retry_exponential_backoff: false
      start_date:
        __type__: datetime.datetime
        year: 2026
        month: 4
        day: 2
      task_id: add
      trigger_rule: all_success
      wait_for_downstream: false
      dependencies: []
      expand:
        x:
        - 2
        - 4
        - 8
        y:
        - 5
        - 10
      partial: {}
  catchup: false
  dag_display_name: repeated_mapping
  owner_links: {}
  start_date:
    __type__: datetime.datetime
    year: 2026
    month: 4
    day: 2
  tags: []
