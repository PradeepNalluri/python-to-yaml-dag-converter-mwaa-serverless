example_google_api_youtube_to_s3:
  dag_id: example_google_api_youtube_to_s3
  params: {}
  default_args:
    start_date:
      __type__: datetime.datetime
      year: 2026
      month: 1
      day: 1
  schedule: '@once'
  tasks:
    create-s3-bucket:
      operator: airflow.providers.amazon.aws.operators.s3.S3CreateBucketOperator
      aws_conn_id: aws_default
      bucket_name: test-bucket
      outlets: []
      priority_weight: 1
      retries: 0
      retry_delay:
        __type__: datetime.timedelta
        seconds: 300.0
      retry_exponential_backoff: false
      start_date:
        __type__: datetime.datetime
        year: 2026
        month: 1
        day: 1
      task_id: create-s3-bucket
      trigger_rule: all_success
      wait_for_downstream: false
      dependencies: []
    wait_for_s3_bucket:
      decorator: airflow.providers.standard.decorators.python.python_task
      outlets: []
      priority_weight: 1
      python_callable: example_google_api_youtube_to_s3_taskflow.wait_for_bucket
      retries: 0
      retry_delay:
        __type__: datetime.timedelta
        seconds: 300.0
      retry_exponential_backoff: false
      start_date:
        __type__: datetime.datetime
        year: 2026
        month: 1
        day: 1
      task_id: wait_for_s3_bucket
      trigger_rule: all_success
      wait_for_downstream: false
      multiple_outputs: false
      dependencies:
      - create-s3-bucket
      s3_bucket_name: test-bucket
    video_ids_to_s3:
      operator: airflow.providers.amazon.aws.transfers.google_api_to_s3.GoogleApiToS3Operator
      aws_conn_id: aws_default
      gcp_conn_id: test-conn-id
      google_api_endpoint_params:
        part: snippet
        channelId: UCSXwxpWZQ7XZ1WL3wqevChA
        maxResults: 50
        publishedAfter: '2019-09-25T00:00:00Z'
        publishedBefore: '2019-10-18T00:00:00Z'
        type: video
        fields: items/id/videoId
      google_api_endpoint_path: youtube.search.list
      google_api_num_retries: 0
      google_api_pagination: false
      google_api_response_via_xcom: video_ids_response
      google_api_service_name: youtube
      google_api_service_version: v3
      outlets: []
      priority_weight: 1
      retries: 0
      retry_delay:
        __type__: datetime.timedelta
        seconds: 300.0
      retry_exponential_backoff: false
      s3_destination_key: https://s3.us-west-2.amazonaws.com/test-bucket/youtube_search
      s3_overwrite: true
      start_date:
        __type__: datetime.datetime
        year: 2026
        month: 1
        day: 1
      task_id: video_ids_to_s3
      trigger_rule: all_success
      wait_for_downstream: false
      dependencies:
      - wait_for_s3_bucket
    transform_video_ids:
      decorator: airflow.providers.standard.decorators.python.python_task
      outlets: []
      priority_weight: 1
      python_callable: example_google_api_youtube_to_s3_taskflow.transform_video_ids
      retries: 0
      retry_delay:
        __type__: datetime.timedelta
        seconds: 300.0
      retry_exponential_backoff: false
      start_date:
        __type__: datetime.datetime
        year: 2026
        month: 1
        day: 1
      task_id: transform_video_ids
      trigger_rule: all_success
      wait_for_downstream: false
      multiple_outputs: false
      dependencies:
      - video_ids_to_s3
    video_data_to_s3:
      operator: airflow.providers.amazon.aws.transfers.google_api_to_s3.GoogleApiToS3Operator
      aws_conn_id: aws_default
      gcp_conn_id: test-conn-id
      google_api_endpoint_params:
        part: snippet
        maxResults: 50
        fields: items(id,snippet(description,publishedAt,tags,title))
      google_api_endpoint_params_via_xcom: video_ids
      google_api_endpoint_path: youtube.videos.list
      google_api_num_retries: 0
      google_api_pagination: false
      google_api_service_name: youtube
      google_api_service_version: v3
      outlets: []
      priority_weight: 1
      retries: 0
      retry_delay:
        __type__: datetime.timedelta
        seconds: 300.0
      retry_exponential_backoff: false
      s3_destination_key: https://s3.us-west-2.amazonaws.com/test-bucket/youtube_videos
      s3_overwrite: true
      start_date:
        __type__: datetime.datetime
        year: 2026
        month: 1
        day: 1
      task_id: video_data_to_s3
      trigger_rule: all_success
      wait_for_downstream: false
      dependencies:
      - transform_video_ids
    delete_s3_bucket:
      operator: airflow.providers.amazon.aws.operators.s3.S3DeleteBucketOperator
      aws_conn_id: aws_default
      bucket_name: test-bucket
      force_delete: true
      outlets: []
      priority_weight: 1
      retries: 0
      retry_delay:
        __type__: datetime.timedelta
        seconds: 300.0
      retry_exponential_backoff: false
      start_date:
        __type__: datetime.datetime
        year: 2026
        month: 1
        day: 1
      task_id: delete_s3_bucket
      trigger_rule: all_done
      wait_for_downstream: false
      dependencies:
      - video_data_to_s3
  catchup: false
  dag_display_name: example_google_api_youtube_to_s3
  owner_links: {}
  start_date:
    __type__: datetime.datetime
    year: 2026
    month: 1
    day: 1
  tags: []
