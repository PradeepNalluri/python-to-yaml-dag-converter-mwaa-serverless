example_ec2:
  dag_id: example_ec2
  params: {}
  default_args:
    owner: airflow
    start_date:
      __type__: datetime.datetime
      year: 2026
      month: 1
      day: 1
    retries: 1
    retry_delay:
      __type__: datetime.timedelta
      seconds: 300.0
  schedule: '@daily'
  tasks:
    env_id:
      operator: airflow.providers.standard.operators.python.PythonOperator
      op_args: []
      op_kwargs: {}
      outlets: []
      priority_weight: 1
      python_callable: ec2.sys_test_context_task
      retries: 1
      retry_delay:
        __type__: datetime.timedelta
        seconds: 300.0
      retry_exponential_backoff: false
      start_date:
        __type__: datetime.datetime
        year: 2026
        month: 1
        day: 1
      task_id: env_id
      trigger_rule: all_success
      wait_for_downstream: false
      dependencies: []
    key_name:
      operator: airflow.providers.standard.operators.python.PythonOperator
      op_args: []
      op_kwargs:
        key_name: "{{ task_instance.xcom_pull(task_ids='env_id', key='return_value')\
          \ }}_key_pair"
      outlets: []
      priority_weight: 1
      python_callable: ec2.create_key_pair
      retries: 1
      retry_delay:
        __type__: datetime.timedelta
        seconds: 300.0
      retry_exponential_backoff: false
      start_date:
        __type__: datetime.datetime
        year: 2026
        month: 1
        day: 1
      task_id: key_name
      trigger_rule: all_success
      wait_for_downstream: false
      dependencies:
      - env_id
    image_id:
      operator: airflow.providers.standard.operators.python.PythonOperator
      op_args: []
      op_kwargs: {}
      outlets: []
      priority_weight: 1
      python_callable: ec2.get_latest_ami_id
      retries: 1
      retry_delay:
        __type__: datetime.timedelta
        seconds: 300.0
      retry_exponential_backoff: false
      start_date:
        __type__: datetime.datetime
        year: 2026
        month: 1
        day: 1
      task_id: image_id
      trigger_rule: all_success
      wait_for_downstream: false
      dependencies:
      - key_name
    create_instance:
      operator: airflow.providers.amazon.aws.operators.ec2.EC2CreateInstanceOperator
      aws_conn_id: aws_default
      config:
        InstanceType: t3.micro
        KeyName: "{{ task_instance.xcom_pull(task_ids='key_name', key='return_value')\
          \ }}"
        TagSpecifications:
        - ResourceType: instance
          Tags:
          - Key: Name
            Value: "{{ task_instance.xcom_pull(task_ids='env_id', key='return_value')\
              \ }}-instance"
        MetadataOptions:
          HttpEndpoint: enabled
          HttpTokens: required
        HibernationOptions:
          Configured: true
        BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            Encrypted: true
            DeleteOnTermination: true
      image_id: "{{ task_instance.xcom_pull(task_ids='image_id', key='return_value')\
        \ }}"
      max_attempts: 20
      max_count: 1
      min_count: 1
      outlets: []
      poll_interval: 20
      priority_weight: 1
      retries: 1
      retry_delay:
        __type__: datetime.timedelta
        seconds: 300.0
      retry_exponential_backoff: false
      start_date:
        __type__: datetime.datetime
        year: 2026
        month: 1
        day: 1
      task_id: create_instance
      trigger_rule: all_success
      wait_for_completion: true
      wait_for_downstream: false
      dependencies:
      - image_id
      - key_name
    instance_id:
      operator: airflow.providers.standard.operators.python.PythonOperator
      op_args:
      - "{{ task_instance.xcom_pull(task_ids='create_instance', key='return_value')\
        \ }}"
      op_kwargs: {}
      outlets: []
      priority_weight: 1
      python_callable: ec2.parse_response
      retries: 1
      retry_delay:
        __type__: datetime.timedelta
        seconds: 300.0
      retry_exponential_backoff: false
      start_date:
        __type__: datetime.datetime
        year: 2026
        month: 1
        day: 1
      task_id: instance_id
      trigger_rule: all_success
      wait_for_downstream: false
      dependencies:
      - create_instance
    stop_instance:
      operator: airflow.providers.amazon.aws.operators.ec2.EC2StopInstanceOperator
      aws_conn_id: aws_default
      check_interval: 15
      instance_id: "{{ task_instance.xcom_pull(task_ids='instance_id', key='return_value')\
        \ }}"
      outlets: []
      priority_weight: 1
      retries: 1
      retry_delay:
        __type__: datetime.timedelta
        seconds: 300.0
      retry_exponential_backoff: false
      start_date:
        __type__: datetime.datetime
        year: 2026
        month: 1
        day: 1
      task_id: stop_instance
      trigger_rule: all_done
      wait_for_downstream: false
      dependencies:
      - instance_id
    start_instance:
      operator: airflow.providers.amazon.aws.operators.ec2.EC2StartInstanceOperator
      aws_conn_id: aws_default
      check_interval: 15
      instance_id: "{{ task_instance.xcom_pull(task_ids='instance_id', key='return_value')\
        \ }}"
      outlets: []
      priority_weight: 1
      retries: 1
      retry_delay:
        __type__: datetime.timedelta
        seconds: 300.0
      retry_exponential_backoff: false
      start_date:
        __type__: datetime.datetime
        year: 2026
        month: 1
        day: 1
      task_id: start_instance
      trigger_rule: all_success
      wait_for_downstream: false
      dependencies:
      - instance_id
      - stop_instance
    await_instance:
      operator: airflow.providers.amazon.aws.sensors.ec2.EC2InstanceStateSensor
      aws_conn_id: aws_default
      deferrable: false
      instance_id: "{{ task_instance.xcom_pull(task_ids='instance_id', key='return_value')\
        \ }}"
      mode: poke
      outlets: []
      poke_interval: 60.0
      priority_weight: 1
      retries: 1
      retry_delay:
        __type__: datetime.timedelta
        seconds: 300.0
      retry_exponential_backoff: false
      start_date:
        __type__: datetime.datetime
        year: 2026
        month: 1
        day: 1
      target_state: running
      task_id: await_instance
      timeout: 604800.0
      trigger_rule: all_success
      wait_for_downstream: false
      dependencies:
      - instance_id
      - start_instance
    reboot_instace:
      operator: airflow.providers.amazon.aws.operators.ec2.EC2RebootInstanceOperator
      aws_conn_id: aws_default
      instance_ids: "{{ task_instance.xcom_pull(task_ids='instance_id', key='return_value')\
        \ }}"
      max_attempts: 20
      outlets: []
      poll_interval: 20
      priority_weight: 1
      retries: 1
      retry_delay:
        __type__: datetime.timedelta
        seconds: 300.0
      retry_exponential_backoff: false
      start_date:
        __type__: datetime.datetime
        year: 2026
        month: 1
        day: 1
      task_id: reboot_instace
      trigger_rule: all_success
      wait_for_completion: true
      wait_for_downstream: false
      dependencies:
      - instance_id
      - await_instance
    hibernate_instace:
      operator: airflow.providers.amazon.aws.operators.ec2.EC2HibernateInstanceOperator
      aws_conn_id: aws_default
      instance_ids: "{{ task_instance.xcom_pull(task_ids='instance_id', key='return_value')\
        \ }}"
      max_attempts: 40
      outlets: []
      poll_interval: 60
      priority_weight: 1
      retries: 1
      retry_delay:
        __type__: datetime.timedelta
        seconds: 300.0
      retry_exponential_backoff: false
      start_date:
        __type__: datetime.datetime
        year: 2026
        month: 1
        day: 1
      task_id: hibernate_instace
      trigger_rule: all_success
      wait_for_completion: true
      wait_for_downstream: false
      dependencies:
      - instance_id
      - reboot_instace
    terminate_instance:
      operator: airflow.providers.amazon.aws.operators.ec2.EC2TerminateInstanceOperator
      aws_conn_id: aws_default
      instance_ids: "{{ task_instance.xcom_pull(task_ids='instance_id', key='return_value')\
        \ }}"
      max_attempts: 20
      outlets: []
      poll_interval: 20
      priority_weight: 1
      retries: 1
      retry_delay:
        __type__: datetime.timedelta
        seconds: 300.0
      retry_exponential_backoff: false
      start_date:
        __type__: datetime.datetime
        year: 2026
        month: 1
        day: 1
      task_id: terminate_instance
      trigger_rule: all_done
      wait_for_completion: true
      wait_for_downstream: false
      dependencies:
      - instance_id
      - hibernate_instace
  catchup: false
  dag_display_name: example_ec2
  owner_links: {}
  start_date:
    __type__: datetime.datetime
    year: 2026
    month: 1
    day: 1
  tags: []
