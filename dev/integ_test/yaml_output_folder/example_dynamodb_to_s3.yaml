example_dynamodb_to_s3:
  dag_id: example_dynamodb_to_s3
  params: {}
  default_args:
    start_date:
      __type__: datetime.datetime
      year: 2026
      month: 1
      day: 1
  schedule: '@once'
  tasks:
    set_up_table:
      decorator: airflow.providers.standard.decorators.python.python_task
      outlets: []
      priority_weight: 1
      python_callable: example_dynamodb_to_s3_taskflow.set_up_table
      retries: 0
      retry_delay:
        __type__: datetime.timedelta
        seconds: 300.0
      retry_exponential_backoff: false
      start_date:
        __type__: datetime.datetime
        year: 2026
        month: 1
        day: 1
      task_id: set_up_table
      trigger_rule: all_success
      wait_for_downstream: false
      multiple_outputs: false
      dependencies: []
      table_name: test-dynamodb-table
    create_bucket:
      operator: airflow.providers.amazon.aws.operators.s3.S3CreateBucketOperator
      aws_conn_id: aws_default
      bucket_name: test-dynamodb-bucket
      outlets: []
      priority_weight: 1
      retries: 0
      retry_delay:
        __type__: datetime.timedelta
        seconds: 300.0
      retry_exponential_backoff: false
      start_date:
        __type__: datetime.datetime
        year: 2026
        month: 1
        day: 1
      task_id: create_bucket
      trigger_rule: all_success
      wait_for_downstream: false
      dependencies:
      - set_up_table
    backup_db:
      operator: airflow.providers.amazon.aws.transfers.dynamodb_to_s3.DynamoDBToS3Operator
      check_interval: 30
      dest_aws_conn_id: aws_default
      dynamodb_table_name: test-dynamodb-table
      export_format: DYNAMODB_JSON
      export_table_to_point_in_time_kwargs: {}
      file_size: 20
      max_attempts: 60
      outlets: []
      point_in_time_export: false
      priority_weight: 1
      process_func: airflow.providers.amazon.aws.transfers.dynamodb_to_s3._convert_item_to_json_bytes
      retries: 0
      retry_delay:
        __type__: datetime.timedelta
        seconds: 300.0
      retry_exponential_backoff: false
      s3_bucket_name: test-dynamodb-bucket
      s3_key_prefix: ''
      source_aws_conn_id: aws_default
      start_date:
        __type__: datetime.datetime
        year: 2026
        month: 1
        day: 1
      task_id: backup_db
      trigger_rule: all_success
      wait_for_downstream: false
      dependencies:
      - wait_for_bucket
    backup_db_segment_1:
      operator: airflow.providers.amazon.aws.transfers.dynamodb_to_s3.DynamoDBToS3Operator
      check_interval: 30
      dest_aws_conn_id: aws_default
      dynamodb_scan_kwargs:
        TotalSegments: 2
        Segment: 0
      dynamodb_table_name: test-dynamodb-table
      export_format: DYNAMODB_JSON
      export_table_to_point_in_time_kwargs: {}
      file_size: 1000
      max_attempts: 60
      outlets: []
      point_in_time_export: false
      priority_weight: 1
      process_func: airflow.providers.amazon.aws.transfers.dynamodb_to_s3._convert_item_to_json_bytes
      retries: 0
      retry_delay:
        __type__: datetime.timedelta
        seconds: 300.0
      retry_exponential_backoff: false
      s3_bucket_name: test-dynamodb-bucket
      s3_key_prefix: dynamodb-segmented-file-1-
      source_aws_conn_id: aws_default
      start_date:
        __type__: datetime.datetime
        year: 2026
        month: 1
        day: 1
      task_id: backup_db_segment_1
      trigger_rule: all_success
      wait_for_downstream: false
      dependencies:
      - backup_db
    backup_db_segment_2:
      operator: airflow.providers.amazon.aws.transfers.dynamodb_to_s3.DynamoDBToS3Operator
      check_interval: 30
      dest_aws_conn_id: aws_default
      dynamodb_scan_kwargs:
        TotalSegments: 2
        Segment: 1
      dynamodb_table_name: test-dynamodb-table
      export_format: DYNAMODB_JSON
      export_table_to_point_in_time_kwargs: {}
      file_size: 1000
      max_attempts: 60
      outlets: []
      point_in_time_export: false
      priority_weight: 1
      process_func: airflow.providers.amazon.aws.transfers.dynamodb_to_s3._convert_item_to_json_bytes
      retries: 0
      retry_delay:
        __type__: datetime.timedelta
        seconds: 300.0
      retry_exponential_backoff: false
      s3_bucket_name: test-dynamodb-bucket
      s3_key_prefix: dynamodb-segmented-file-2-
      source_aws_conn_id: aws_default
      start_date:
        __type__: datetime.datetime
        year: 2026
        month: 1
        day: 1
      task_id: backup_db_segment_2
      trigger_rule: all_success
      wait_for_downstream: false
      dependencies:
      - backup_db_segment_1
    get_export_time:
      decorator: airflow.providers.standard.decorators.python.python_task
      outlets: []
      priority_weight: 1
      python_callable: example_dynamodb_to_s3_taskflow.get_export_time
      retries: 0
      retry_delay:
        __type__: datetime.timedelta
        seconds: 300.0
      retry_exponential_backoff: false
      start_date:
        __type__: datetime.datetime
        year: 2026
        month: 1
        day: 1
      task_id: get_export_time
      trigger_rule: all_success
      wait_for_downstream: false
      multiple_outputs: false
      dependencies:
      - backup_db_segment_2
      table_name: test-dynamodb-table
    backup_db_to_point_in_time_full_export:
      operator: airflow.providers.amazon.aws.transfers.dynamodb_to_s3.DynamoDBToS3Operator
      check_interval: 30
      dest_aws_conn_id: aws_default
      dynamodb_table_name: test-dynamodb-table
      export_format: DYNAMODB_JSON
      export_table_to_point_in_time_kwargs: {}
      export_time: "{{ task_instance.xcom_pull(task_ids='get_export_time', key='return_value')\
        \ }}"
      file_size: 1000
      max_attempts: 90
      outlets: []
      point_in_time_export: true
      priority_weight: 1
      process_func: airflow.providers.amazon.aws.transfers.dynamodb_to_s3._convert_item_to_json_bytes
      retries: 0
      retry_delay:
        __type__: datetime.timedelta
        seconds: 300.0
      retry_exponential_backoff: false
      s3_bucket_name: test-dynamodb-bucket
      s3_key_prefix: dynamodb-segmented-file-3-
      source_aws_conn_id: aws_default
      start_date:
        __type__: datetime.datetime
        year: 2026
        month: 1
        day: 1
      task_id: backup_db_to_point_in_time_full_export
      trigger_rule: all_success
      wait_for_downstream: false
      dependencies:
      - get_export_time
    delete_dynamodb_table:
      decorator: airflow.providers.standard.decorators.python.python_task
      outlets: []
      priority_weight: 1
      python_callable: example_dynamodb_to_s3_taskflow.delete_dynamodb_table
      retries: 0
      retry_delay:
        __type__: datetime.timedelta
        seconds: 300.0
      retry_exponential_backoff: false
      start_date:
        __type__: datetime.datetime
        year: 2026
        month: 1
        day: 1
      task_id: delete_dynamodb_table
      trigger_rule: all_done
      wait_for_downstream: false
      multiple_outputs: false
      dependencies:
      - backup_db_to_point_in_time_incremental_export
      table_name: test-dynamodb-table
    delete_bucket:
      operator: airflow.providers.amazon.aws.operators.s3.S3DeleteBucketOperator
      aws_conn_id: aws_default
      bucket_name: test-dynamodb-bucket
      force_delete: true
      outlets: []
      priority_weight: 1
      retries: 0
      retry_delay:
        __type__: datetime.timedelta
        seconds: 300.0
      retry_exponential_backoff: false
      start_date:
        __type__: datetime.datetime
        year: 2026
        month: 1
        day: 1
      task_id: delete_bucket
      trigger_rule: all_done
      wait_for_downstream: false
      dependencies:
      - delete_dynamodb_table
    get_latest_export_time:
      decorator: airflow.providers.standard.decorators.python.python_task
      outlets: []
      priority_weight: 1
      python_callable: example_dynamodb_to_s3_taskflow.get_latest_export_time
      retries: 0
      retry_delay:
        __type__: datetime.timedelta
        seconds: 300.0
      retry_exponential_backoff: false
      start_date:
        __type__: datetime.datetime
        year: 2026
        month: 1
        day: 1
      task_id: get_latest_export_time
      trigger_rule: all_success
      wait_for_downstream: false
      multiple_outputs: false
      dependencies:
      - backup_db_to_point_in_time_full_export
      table_name: test-dynamodb-table
    backup_db_to_point_in_time_incremental_export:
      operator: airflow.providers.amazon.aws.transfers.dynamodb_to_s3.DynamoDBToS3Operator
      check_interval: 30
      dest_aws_conn_id: aws_default
      dynamodb_table_name: test-dynamodb-table
      export_format: DYNAMODB_JSON
      export_table_to_point_in_time_kwargs:
        ExportType: INCREMENTAL_EXPORT
        IncrementalExportSpecification:
          ExportFromTime: "{{ task_instance.xcom_pull(task_ids='get_export_time',\
            \ key='return_value') }}"
          ExportToTime: "{{ task_instance.xcom_pull(task_ids='get_latest_export_time',\
            \ key='return_value') }}"
          ExportViewType: NEW_AND_OLD_IMAGES
      file_size: 1000
      max_attempts: 90
      outlets: []
      point_in_time_export: true
      priority_weight: 1
      process_func: airflow.providers.amazon.aws.transfers.dynamodb_to_s3._convert_item_to_json_bytes
      retries: 0
      retry_delay:
        __type__: datetime.timedelta
        seconds: 300.0
      retry_exponential_backoff: false
      s3_bucket_name: test-dynamodb-bucket
      s3_key_prefix: dynamodb-segmented-file-4-
      source_aws_conn_id: aws_default
      start_date:
        __type__: datetime.datetime
        year: 2026
        month: 1
        day: 1
      task_id: backup_db_to_point_in_time_incremental_export
      trigger_rule: all_success
      wait_for_downstream: false
      dependencies:
      - get_export_time
      - should_run_incremental_export
      - get_latest_export_time
    should_run_incremental_export:
      decorator: airflow.providers.standard.decorators.short_circuit.short_circuit_task
      ignore_downstream_trigger_rules: true
      outlets: []
      priority_weight: 1
      python_callable: example_dynamodb_to_s3_taskflow.should_run_incremental_export
      retries: 0
      retry_delay:
        __type__: datetime.timedelta
        seconds: 300.0
      retry_exponential_backoff: false
      start_date:
        __type__: datetime.datetime
        year: 2026
        month: 1
        day: 1
      task_id: should_run_incremental_export
      trigger_rule: all_success
      wait_for_downstream: false
      multiple_outputs: false
      dependencies:
      - get_export_time
      - get_latest_export_time
      start_time: +get_export_time
      end_time: +get_latest_export_time
    wait_for_bucket:
      decorator: airflow.providers.standard.decorators.python.python_task
      outlets: []
      priority_weight: 1
      python_callable: example_dynamodb_to_s3_taskflow.wait_for_bucket
      retries: 0
      retry_delay:
        __type__: datetime.timedelta
        seconds: 300.0
      retry_exponential_backoff: false
      start_date:
        __type__: datetime.datetime
        year: 2026
        month: 1
        day: 1
      task_id: wait_for_bucket
      trigger_rule: all_success
      wait_for_downstream: false
      multiple_outputs: false
      dependencies:
      - create_bucket
      s3_bucket_name: test-dynamodb-bucket
  catchup: false
  dag_display_name: example_dynamodb_to_s3
  owner_links: {}
  start_date:
    __type__: datetime.datetime
    year: 2026
    month: 1
    day: 1
  tags: []
